name: Playwright Tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start services
        run: docker compose up -d

      - name: Wait for PostgreSQL
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          pg_isready -h localhost -p 5432 -U school
        env:
          PGPASSWORD: school

      - name: Wait for Redis
        run: |
          sudo apt-get update && sudo apt-get install -y redis-tools
          redis-cli -h localhost ping

      - name: Wait for MinIO
        run: |
          curl -s http://localhost:9000/minio/health/live || (sleep 5 && curl -s http://localhost:9000/minio/health/live)

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://school:school@localhost:5432/school_management?schema=public

      - name: Build all packages
        run: pnpm build

      - name: Start backend
        run: pnpm --filter backend start &
        env:
          DATABASE_URL: postgresql://school:school@localhost:5432/school_management?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key
          JWT_REFRESH_SECRET: test-refresh-secret-key
          JWT_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 7d
          PORT: 3001
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:3000,http://localhost:3002
          THROTTLE_TTL: 60000
          THROTTLE_LIMIT: 100
          LOG_LEVEL: info
          LOG_FILE_PATH: ./logs
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET: school-management
          S3_REGION: us-east-1

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:3001/api/v1/health > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        continue-on-error: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose down
